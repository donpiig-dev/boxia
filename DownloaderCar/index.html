<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VM Admin - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
  <style>
    /* 1. Evita que la estructura del layout o el body superen el ancho del dispositivo */
html, body {
  max-width: 100vw;
  overflow-x: hidden;
  box-sizing: border-box;
}

/* 2. Asegura que el contenedor de la tabla tenga scroll interno si es necesario, 
   en lugar de romper toda la interfaz de la PWA */
.table-container {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch; /* Scroll suave en iOS */
}

/* 3. Fuerza a la tabla a respetar el espacio asignado sin estirarse */
table {
  width: 100%;
  table-layout: fixed; /* 💡 Esta regla es mágica: obliga a respetar los anchos establecidos */
  border-collapse: collapse;
}

/* 4. Recorta los links gigantes añadiendo puntos suspensivos (...) */
.video-url-text {
  display: block;
  width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
  </style>
<body>

  <div id="login-section" class="card">
    <h2>Iniciar Sesión</h2>
    <form id="login-form">
      <input type="text" id="username" placeholder="Usuario" required>
      <input type="password" id="password" placeholder="Contraseña" required>
      <button type="submit">Ingresar</button>
    </form>
    <p id="login-error" class="error"></p>
  </div>

  <div id="dashboard-section" class="hidden">
    <header>
      <h1>Panel de Pendientes</h1>
      <button id="logout-btn" class="btn-danger">Cerrar Sesión</button>
    </header>

    <div class="card">
      <h3>Agregar Nuevo Video</h3>
      <form id="video-form">
        <input type="hidden" id="video-id">
        <input type="url" id="video-url" placeholder="Pega el link del video aquí..." required>
        <button type="submit" id="submit-btn">Guardar Enlace</button>
        <button type="button" id="cancel-btn" class="hidden">Cancelar</button>
      </form>
    </div>

    <div class="card">
      <h3>Lista de Enlaces Pendientes</h3>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Enlace</th>
              <th>Fecha</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="video-list">
            </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
